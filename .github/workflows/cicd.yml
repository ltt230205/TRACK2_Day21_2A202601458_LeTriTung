name: Income Model CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      previous_f1: ${{ steps.compare_previous.outputs.previous_f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # AWS credentials are stored as GitHub Actions secrets.
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}" >> "$GITHUB_ENV"

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        #         Set ket qua thanh output "f1" de job quality-gate co the doc.
        #
        # Goi y:
        #   F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
        #   echo "f1=$F1" >> $GITHUB_OUTPUT
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      - name: Compare with current production report
        id: compare_previous
        run: |
          python - <<'PYEOF'
          import json
          import os
          import sys
          import boto3
          from botocore.exceptions import ClientError

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          new_report = json.load(open("outputs/report.json"))
          new_f1 = float(new_report["f1_score"])
          previous_f1 = None

          s3 = boto3.client("s3")
          try:
              obj = s3.get_object(Bucket=bucket_name, Key="artifacts/current/report.json")
              previous_report = json.loads(obj["Body"].read())
              previous_f1 = float(previous_report["f1_score"])
          except ClientError as exc:
              if exc.response["Error"]["Code"] not in {"NoSuchKey", "404"}:
                  raise

          if previous_f1 is None:
              print("No previous production report found; deployment allowed.")
              previous_output = ""
          else:
              print(f"Previous production f1_score={previous_f1:.4f}")
              print(f"New candidate f1_score={new_f1:.4f}")
              if new_f1 < previous_f1:
                  raise SystemExit(
                      f"FAILED: new f1_score {new_f1:.4f} < previous {previous_f1:.4f}. Huy trien khai."
                  )
              previous_output = str(previous_f1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"previous_f1={previous_output}\n")
          PYEOF
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          uploads = {
              "models/model.joblib": "artifacts/current/model.joblib",
              "outputs/report.json": "artifacts/current/report.json",
              "outputs/detail.txt": "artifacts/current/detail.txt",
          }
          for src, key in uploads.items():
              s3.upload_file(src, bucket_name, key)
              print(f"Uploaded {src} to s3://{bucket_name}/{key}")
          PYEOF
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

      - name: Save reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        # TODO 6: Doc f1 tu output cua job train.
        #         Neu f1 < 0.65, ket thuc voi loi ro rang.
        #         Neu dat nguong, in thong bao va tiep tuc.
        #
        # Goi y:
        #   f1 = float("${{ needs.train.outputs.f1 }}")
        #   if f1 < 0.65:
        #       raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
        #   print("PASSED: dang trien khai model.")
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          threshold = 0.65
          if f1 < threshold:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < {threshold:.2f}. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= {threshold:.2f}. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # TODO 7: Restart service income-api tren VM.
            # TODO 8: Cho server san sang roi goi curl /healthz de xac nhan.
            #         Neu health check that bai sau nhieu lan thu, thoat voi exit 1.
            #
            # Goi y:
            #   sudo systemctl restart income-api
            #   sleep 5
            #   curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz
            echo "Health check passed."
